name: Refresh intelligence and deploy Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-deployment
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect public RSS candidates
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Persist collected data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: daily intelligence refresh [skip ci]"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Check collection results
        if: steps.collect.outcome == 'failure'
        run: |
          echo "Collector failed; see data/status.json" >&2
          exit 1
